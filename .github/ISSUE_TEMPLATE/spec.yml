name: 📋 Specification Request
description: Proponha uma nova especificação de funcionalidade (Etapa 2 — Spec)
title: "[SPEC] "
labels: [ "spec", "stage-2" ]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        > Use este modelo ao iniciar uma nova especificação em `.spec/<NNN>-<feature>/`.
        > Em geral, Requirements Engineer ou Product Owner abre esta issue.

  - type: input
    id: feature-id
    attributes:
      label: ID da funcionalidade
      description: Número de três dígitos — deve corresponder ao nome da pasta em `.spec/`
      placeholder: "003"
    validations:
      required: true

  - type: input
    id: feature-name
    attributes:
      label: Nome da funcionalidade (kebab-case)
      placeholder: "<feature-name>"
    validations:
      required: true

  - type: textarea
    id: business-goal
    attributes:
      label: Objetivo de negócio
      description: Qual resultado esta funcionalidade viabiliza? Relacione-o a uma regra de negócio do SIFAP
        quando possível.
      placeholder: "<descreva o resultado identificado pela equipe>"
    validations:
      required: true

  - type: textarea
    id: ears-requirements
    attributes:
      label: Requisitos EARS iniciais (rascunho)
      description: Use os 6 padrões EARS. Requirements Engineer refinará estes requisitos.
      value: |
        - REQ-XXX-001 (Ubiquitous): The system shall ...
        - REQ-XXX-002 (Event-driven): When ..., the system shall ...
        - REQ-XXX-003 (State-driven): While ..., the system shall ...
    validations:
      required: true

  - type: textarea
    id: source-legacy
    attributes:
      label: Rastreabilidade legada (source_legacy)
      description: Cada REQ-ID deve citar um .NSN Natural, um .ddm Adabas ou uma fonte [GREENFIELD] justificada.
      value: |
        source_legacy: 01-archaeology/legacy-sifap/natural-programs/<FILE>.NSN#L<start>-L<end>
        # or: source_legacy: "[GREENFIELD] <one-line justification>"
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Critérios de aceitação
      description: Como você verificará se a especificação está completa?
      placeholder: |
        - [ ] Todos os requisitos usam um padrão EARS válido
        - [ ] Cada requisito pode ser testado
        - [ ] Product Owner aprovou o escopo
    validations:
      required: true

  - type: dropdown
    id: lead-persona
    attributes:
      label: Persona líder
      options:
        - Requirements Engineer
        - Product Owner
        - Software Architect
        - Enterprise Architect
    validations:
      required: true
