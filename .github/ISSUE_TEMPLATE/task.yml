name: ✅ Implementation Task
description: Uma única tarefa de implementação com escopo definido, derivada de uma especificação
title: "[T-NNN] "
labels: [ "task", "stage-3" ]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        > Use este modelo para uma tarefa de implementação por vez.
        > As tarefas vêm de `.spec/<NNN>-<feature>/tasks.md` e são executadas individualmente pelo participante durante a Etapa 3.

  - type: input
    id: task-id
    attributes:
      label: ID da tarefa
      placeholder: "T-007"
    validations:
      required: true

  - type: input
    id: feature-folder
    attributes:
      label: Pasta da funcionalidade
      placeholder: ".spec/<NNN>-<feature>/"
    validations:
      required: true

  - type: input
    id: req-ids
    attributes:
      label: REQ-IDs implementados
      description: Lista separada por vírgulas de todos os IDs de requisito atendidos por esta tarefa.
      placeholder: "REQ-XXX, REQ-YYY"
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Critérios de aceitação (da especificação)
      description: Copie de `spec.md` para que a pessoa responsável pela implementação não precise alternar arquivos.
      placeholder: |
        - When <event>, the system shall <verifiable behavior>.
        - If <condition>, the system shall NOT <prohibited behavior>.
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Estimativa de complexidade
      options:
        - XS (<1h)
        - S (1-2h)
        - M (2-4h)
        - L (4-8h)
        - XL (>1 day)
    validations:
      required: true

  - type: dropdown
    id: lead-responsibility
    attributes:
      label: Responsabilidade principal
      options:
        - Developer
        - DBA
        - QA Engineer
        - DevOps Engineer
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Depende de
      placeholder: |
        - T-XXX (tarefa pré-requisito)
        - ADR-XXXX (decisão relevante)

  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      value: |
        - [ ] Há pelo menos um teste por critério de aceitação (red → green → refactor)
        - [ ] Todos os métodos públicos que atendem a um `REQ-ID` têm Javadoc `@implements REQ-NNN`
        - [ ] A CI está verde (build, lint, type-check, testes, cobertura)
        - [ ] O impacto na migração ou reconciliação de dados está registrado, quando aplicável
        - [ ] A caixa correspondente em `tasks.md` só está marcada com evidências
        - [ ] O título do PR usa Conventional Commits e vincula esta issue
        - [ ] O checklist do PR de submissão está atualizado antes da notificação ao juiz
    validations:
      required: true
