name: 🧱 Architecture Decision Record (ADR)
description: Documente uma decisão significativa de arquitetura ou design
title: "[ADR] "
labels: [ "adr", "stage-2", "architecture" ]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        > Use este modelo quando houver uma decisão não trivial (>1 hora para revisitar depois).
        > Exemplos: escolha entre monólito e microsserviços, estratégia de persistência, modelo de autenticação.

  - type: input
    id: adr-number
    attributes:
      label: Número da ADR (sequencial)
      placeholder: "0007"
    validations:
      required: true

  - type: input
    id: adr-title
    attributes:
      label: Título
      placeholder: "<título curto da decisão>"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Qual problema observado motiva esta decisão?
      placeholder: "<evidências, restrições e decisão a tomar>"
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: Decisão
      description: A mudança que propomos ou concordamos em realizar.
      placeholder: "<decisão tomada explicitamente pela equipe>"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      placeholder: |
        - <alternativa A> — <trade-off>
        - <alternativa B> — <trade-off>
    validations:
      required: true

  - type: textarea
    id: consequences
    attributes:
      label: Consequências
      description: O que se torna mais fácil? O que se torna mais difícil? Há riscos?
      placeholder: |
        Mais fácil: <efeito>
        Mais difícil: <efeito>
        Mitigação: <ação>
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - proposed
        - accepted
        - deprecated
        - superseded
    validations:
      required: true

  - type: input
    id: supersedes
    attributes:
      label: Substitui (número da ADR, se houver)
      placeholder: "Não se aplica"

  - type: dropdown
    id: lead-persona
    attributes:
      label: Persona autora
      options:
        - Enterprise Architect
        - Software Architect
        - Technical Lead
    validations:
      required: true
